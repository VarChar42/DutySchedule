name: iOS TestFlight

on:
  workflow_dispatch: {}

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: iosApp
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iosApp

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls /Applications | grep '^Xcode' | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "/Applications/$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: iosApp/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('iosApp/dutyscheduleIOS.xcodeproj/**', 'iosApp/dutyscheduleIOS/**/*.swift') }}
          restore-keys: |
            xcode-deriveddata-${{ runner.os }}-

      - name: Write App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: echo "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # match owns the persistent signing identity: GitHub-hosted runners
      # are ephemeral, so plain -allowProvisioningUpdates has no keychain
      # to reuse and either mints a throwaway cert each run (whose key dies
      # with the VM) or, worse, drifts between Development/Distribution.
      # match fetches (or creates once, then stores encrypted in the
      # MATCH_GIT_URL repo) a single real cert+profile pair every run.
      # setup_ci creates a fresh, unlocked, non-UI keychain and adds it to
      # the search list. Without it, importing the cert and later codesign
      # invocations (e.g. the shared framework's embed-and-sign build phase)
      # can trigger a "codesign wants to access your keychain" GUI prompt
      # that nothing can answer in headless CI, hanging the job silently
      # until it hits the workflow timeout.
      - name: Set up CI keychain
        run: bundle exec fastlane run setup_ci

      - name: Fetch signing certificate via match
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          API_KEY_JSON_PATH="$RUNNER_TEMP/asc_api_key.json" AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ruby -rjson -e '
            File.write(
              ENV["API_KEY_JSON_PATH"],
              JSON.generate({
                "key_id" => ENV["ASC_KEY_ID"],
                "issuer_id" => ENV["ASC_ISSUER_ID"],
                "key" => File.read(ENV["AUTH_KEY_PATH"]),
                "in_house" => false
              })
            )
          '
          bundle exec fastlane match appstore --readonly false --api_key_path "$RUNNER_TEMP/asc_api_key.json"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project dutyscheduleIOS.xcodeproj \
            -scheme dutyscheduleIOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/dutyscheduleIOS.xcarchive" \
            -derivedDataPath DerivedData \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="match AppStore me.emiliomini.dutyscheduleIOS" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>me.emiliomini.dutyscheduleIOS</key>
                  <string>match AppStore me.emiliomini.dutyscheduleIOS</string>
              </dict>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/dutyscheduleIOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

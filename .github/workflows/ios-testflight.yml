name: iOS TestFlight

on:
  workflow_dispatch: {}

# Serialize runs: two concurrent uploads would race for the same build
# number and one would be rejected by App Store Connect as a duplicate.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

# Only static values here: the `runner` context (RUNNER_TEMP) isn't
# available to workflow- or job-level env, so paths derived from it are
# built inside the run blocks from $RUNNER_TEMP instead.
env:
  APP_IDENTIFIER: me.emiliomini.dutyscheduleIOS
  PROFILE_NAME: match AppStore me.emiliomini.dutyscheduleIOS

jobs:
  beta:
    # Standard runner: 3 cores / 7GB, and free for public repos (the
    # xlarge tier is billed at ~$0.16/min). The tradeoff is the
    # Kotlin/Native release link, which is slow here and needs its heap
    # kept within the smaller RAM - see the framework step below.
    #
    # Timeouts are generous because nothing is being spent; per-step
    # limits below still stop a genuine stall from burning 90 minutes.
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: iosApp
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iosApp

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls /Applications | grep '^Xcode' | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "/Applications/$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      # Keyed on project.pbxproj rather than the whole .xcodeproj: that
      # bundle also holds xcuserdata, which churns without affecting the
      # build and would needlessly invalidate the cache.
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: iosApp/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('iosApp/dutyscheduleIOS.xcodeproj/project.pbxproj', 'iosApp/dutyscheduleIOS/**') }}
          restore-keys: |
            xcode-deriveddata-${{ runner.os }}-

      - name: Write App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          echo "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          # Fail loudly here rather than with an opaque auth error later.
          if ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey.p8"; then
            echo "::error::ASC_KEY_CONTENT did not decode to a valid .p8 private key."
            echo "It must be the base64 encoding of the whole AuthKey_*.p8 file."
            exit 1
          fi

      # match owns the persistent signing identity: GitHub-hosted runners
      # are ephemeral, so plain -allowProvisioningUpdates has no keychain
      # to reuse and either mints a throwaway cert each run (whose private
      # key dies with the VM) or drifts between Development/Distribution.
      # match installs the one real cert+profile pair held encrypted in the
      # MATCH_GIT_URL repo.
      #
      # --readonly: never create or renew certificates from CI. Earlier runs
      # left three stray auto-created Development certs on the account, and
      # the distribution cert limit is low enough that silent creation can
      # wedge the whole team. If this step starts failing because the cert
      # or profile expired, regenerate it deliberately (locally, or by
      # temporarily flipping this flag) rather than letting CI do it.
      #
      # The keychain must exist before match can install into it - match
      # only takes its name/password, it won't create the file. Without a
      # keychain whose password match knows, it can't set the key's
      # access-control partition list, so the cert lands but xcodebuild
      # can't see its private key ("No signing certificate ... with a
      # private key was found"). The keychain dies with the VM, so this
      # password needn't be secret.
      - name: Install signing certificate via match
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MATCH_KEYCHAIN_NAME: ci-build.keychain
          MATCH_KEYCHAIN_PASSWORD: ci-build-keychain-password
        run: |
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          # -lut 21600: don't auto-lock mid-build (default is 5 min idle).
          security set-keychain-settings -lut 21600 "$MATCH_KEYCHAIN_NAME"
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          # Prepend to the search list, keeping the existing keychains so
          # the system roots stay resolvable. Unquoted on purpose: the
          # existing entries must word-split into separate arguments.
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[" ]//g')
          security list-keychains -d user -s "$MATCH_KEYCHAIN_NAME" $EXISTING_KEYCHAINS

          # Built with Ruby, not a heredoc: the PEM has real newlines,
          # which a JSON string literal can't carry unescaped.
          ASC_KEY_JSON_PATH="$RUNNER_TEMP/asc_api_key.json" \
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" \
          ruby -rjson -e '
            File.write(
              ENV["ASC_KEY_JSON_PATH"],
              JSON.generate({
                "key_id" => ENV["ASC_KEY_ID"],
                "issuer_id" => ENV["ASC_ISSUER_ID"],
                "key" => File.read(ENV["ASC_KEY_PATH"]),
                "in_house" => false
              })
            )
          '
          bundle exec fastlane match appstore --readonly true --api_key_path "$RUNNER_TEMP/asc_api_key.json"

      # Build the Kotlin/Native framework in its own step rather than
      # leaving it to Xcode's embed-and-sign Run Script phase.
      #
      # Xcode buffers script-phase stdout until the phase ends, so a link
      # that takes tens of minutes prints nothing the entire time - and
      # prints nothing at all if the job is cancelled first, which is why
      # the 60-minute timeout produced a log that just stopped dead.
      # Running it here streams Gradle's output live and gives a real
      # timing number for the expensive part of the build.
      #
      # It should also be faster, and is what makes gradle.properties' 4g
      # heap workable on a 7GB runner: Gradle gets the machine to itself
      # instead of contending with Xcode, which is when 4g previously
      # thrashed, and --no-daemon stops the daemon lingering into the
      # Xcode build. The archive's script phase then finds the task up to
      # date and only copies the framework.
      - name: Build shared Kotlin framework
        timeout-minutes: 45
        working-directory: .
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --console=plain

      # Manual signing pinned to match's identity. Automatic signing has no
      # stable identity to resolve to on a throwaway runner, and mixing the
      # two ("automatically signed for development, but a conflicting code
      # signing identity ... manually specified") is a hard error.
      #
      # Build number is run_number.run_attempt so that re-running a failed
      # job still produces a build App Store Connect will accept - it
      # rejects a CFBundleVersion it has already seen.
      - name: Archive
        timeout-minutes: 20
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project dutyscheduleIOS.xcodeproj \
            -scheme dutyscheduleIOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/dutyscheduleIOS.xcarchive" \
            -derivedDataPath DerivedData \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

      # Export only - no `destination: upload`. That option makes
      # xcodebuild upload via Xcode's Accounts (Apple ID) machinery, which
      # a CI runner has no signed-in account for, and it fails with the
      # unhelpful "Failed to Use Accounts" regardless of the
      # -authenticationKey* flags. Exporting locally and uploading in a
      # separate step keeps the two failure modes distinguishable.
      #
      # With manual signing the export itself needs no credentials: the
      # profile and cert are already in the keychain.
      - name: Export IPA
        timeout-minutes: 10
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$APP_IDENTIFIER</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/dutyscheduleIOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # Uploads with the App Store Connect API key (reusing the JSON the
      # match step already built), which is token-based and needs no
      # account. skip_waiting_for_build_processing keeps this from idling
      # on the clock while Apple processes the build - and on a billed
      # runner that wait is money.
      - name: Upload to TestFlight
        timeout-minutes: 15
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa found in $RUNNER_TEMP/export"
            ls -lR "$RUNNER_TEMP/export" || true
            exit 1
          fi
          echo "Uploading $IPA_PATH"
          bundle exec fastlane run upload_to_testflight \
            api_key_path:"$RUNNER_TEMP/asc_api_key.json" \
            ipa:"$IPA_PATH" \
            app_identifier:"$APP_IDENTIFIER" \
            skip_waiting_for_build_processing:true
